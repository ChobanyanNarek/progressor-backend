services:
  - type: web
    name: ghost-app-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Database — injected from the Render-managed PostgreSQL below
      - key: DB_TYPE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: ghost-app-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ghost-app-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: ghost-app-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ghost-app-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: ghost-app-db
          property: database
      - key: DB_SSL
        value: "true"

      # App settings — set the rest in the Render dashboard → Environment
      - key: JWT_EXPIRATION_TIME
        value: 86400
      - key: FALLBACK_LANGUAGE
        value: en_US
      - key: ENABLE_ORM_LOGS
        value: "false"
      - key: ENABLE_DOCUMENTATION
        value: "true"
      - key: API_VERSION
        value: v1.0.0

      # Secrets — add these in the Render dashboard (never commit real values)
      # JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, CORS_ORIGINS, FRONTEND_URL
      # PM_TRACKER_CREDENTIALS_KEY -- AES-256 key for the integration token vault:
      #   openssl rand -base64 32
      #   Without it the vault stays off and clients keep their tokens locally.
      # BOOTSTRAP_SECRET -- opens the /auth/init-* routes, which hand out super admin
      #   with no session behind them. Leave it UNSET: the routes answer 404 without it.
      #   Set it only for as long as it takes to recover an account, then remove it.

databases:
  - name: ghost-app-db
    databaseName: ghost_app
    user: ghost_app
    # Not `free`: Render deletes a free database after 30 days, which is what took the
    # API down with ECONNREFUSED to a host that no longer existed.
    plan: basic-256mb
    region: frankfurt
